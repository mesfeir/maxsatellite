[package]
name = "maxsatellite"
version = "0.1.0"
edition = "2021"
description = "MaxSatellite - download the highest-resolution satellite imagery available for any area"
default-run = "maxsatellite"

[[bin]]
name = "maxsatellite"
path = "src/main.rs"

[build-dependencies]
# Embeds assets/maxsatellite.ico in the .exe as a Win32 resource (build.rs).
winresource = "0.1"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
flate2 = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "gzip",
    "brotli",
    "http2",
    "multipart",
    "json",
] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "tiff",
    "rayon",
] }
egui = "0.29"
tiny_http = "0.12"
# Both renderers are compiled in so `MS_RENDERER` can switch at runtime.
# wgpu is the default: see the comment on `NativeOptions` in src/app.rs.
eframe = { version = "0.29", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "web_screen_reader",
    "wgpu",
    "x11",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
